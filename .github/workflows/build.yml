name: Rust Workspace Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check workspace configuration
        run: |
          echo "Workspace members:"
          cargo metadata --format-version=1 --no-deps | python3 -c "import sys,json; data=json.load(sys.stdin); [print('  -', m['name']) for m in data['workspace_members']]"

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Run tests for workspace
        run: cargo test --workspace --verbose

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run rustfmt check
        run: cargo fmt -- --check
