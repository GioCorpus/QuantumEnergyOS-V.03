[package]
name = "identity_service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "tracing", "json", "http2"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "offline",
    "macros"
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = { version = "0.5", features = ["rand_core", "std"] }
jsonwebtoken = { version = "9", features = ["pem"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
once_cell = "1"
async-trait = "0.1"
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }
http = "1"

[dev-dependencies]
sqlx = { version = "0.8", features = ["postgres", "migrate"] }
tokio-test = "0.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
testcontainers = "0.14"
anyhow = "1.0"

[build-dependencies]
dotenvy = "0.15"

[sqlx]
database = "PostgreSQL"
