[package]
name = "qb_platform_backend"
version = "0.1.0"
edition = "2021"
authors = ["QuantumEnergyOS"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
hyper = { version = "0.14", features = ["server"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

# additional runtime dependencies used by tests and tiny integrations
tower = "0.5"
http = "0.2"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

[workspace]

