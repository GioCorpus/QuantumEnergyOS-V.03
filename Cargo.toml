[workspace]
resolver = "2"
members = [
    "quantum-browser-daemon",
    "photonic-core",
    "photonic-bridge",
    "qeos-telemetry",
    "universe-simulator",
    "qeos/daemons/quantumd",
    "qeos/daemons/energyd",
    "qeos/daemons/climated",
    "qeos/daemons/photonicd",
    "qeos/daemons/aicored",
    "qeos/libs/qeos-common",
    "qeos/libs/qeos-quantum",
    "qeos/libs/qeos-energy",
    "qeos/libs/qeos-climate",
    "qeos/libs/qeos-photonic",
    "qeos/cores/kernel",
    "qeos/tests",
]

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1.7", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
thiserror = "2.0"
config = "0.14"
axum = "0.8"
metrics = "0.24"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
postgres = { version = "0.19", features = ["with-uuid-0_8", "with-chrono-0_4"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
rdkafka = { version = "0.37", features = ["tokio"] }
ndarray = "0.16"
num-complex = "0.4"
linfa = "0.7"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

